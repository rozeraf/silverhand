# git-cliff config: https://git-cliff.org/docs/configuration
# CHANGELOG.md and GitHub release notes are generated from Conventional Commits.
#   bun run changelog -- --tag vX.Y.Z   # before a release (on dev)
#   bun run release-notes               # notes for the latest tag (used by CI)

[changelog]
header = """
# Changelog

Все заметные изменения проекта. Формат — [Keep a Changelog](https://keepachangelog.com/ru/1.1.0/), \
версии — [SemVer](https://semver.org/lang/ru/).
Файл генерируется [git-cliff](https://git-cliff.org) из Conventional Commits, руками не редактируется.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} **[BREAKING]**{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/rozeraf/silverhand/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/rozeraf/silverhand/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/rozeraf/silverhand/releases/tag/{{ release.version }}
{% endif -%}
{% elif release.previous.version -%}
[unreleased]: https://github.com/rozeraf/silverhand/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor -%}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments only fix the section order; they are stripped from the output.
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: sync", skip = true },
  { message = "^feat", group = "<!-- 0 -->Новое" },
  { message = "^fix", group = "<!-- 1 -->Исправления" },
  { message = "^perf", group = "<!-- 2 -->Производительность" },
  { message = "^refactor", group = "<!-- 3 -->Рефакторинг" },
  { message = "^style", group = "<!-- 4 -->Оформление" },
  { message = "^docs", group = "<!-- 5 -->Документация" },
  { message = "^(ci|build)", group = "<!-- 6 -->CI и сборка" },
  { message = "^chore", group = "<!-- 7 -->Прочее" },
]
